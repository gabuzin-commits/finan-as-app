<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minhas Finanças</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c2578a"><link rel="apple-touch-icon" href="icon-192.png"><style>

</style></head><body><div id="app">Carregando…</div><nav id="nv"></nav><script>
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),T=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const NOW=new Date(),CY=NOW.getFullYear(),uid0=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DEF=()=>({cards:[{n:'Cartão 1',t:'Crédito'},{n:'Cartão 2',t:'Crédito'},{n:'Pix/Débito',t:'Débito'},{n:'Dinheiro',t:'Dinheiro'}],

let S={cfg:null,yrs:{}},V={tab:'mes',ay:CY,y:CY,m:NOW.getMonth(),ya:CY,yb:CY-1,met:'g'},db=null,uid=null,dl=null;
const E0=()=>({g:[],e:[],i:[],d:[]}),Y=y=>S.yrs[y]||(S.yrs[y]=E0()),mo=x=>+x.d.slice(5,7)-1;
const pd=n=>String(n).padStart(2,'0');
function parcOf(p,y){const r=[];for(let m=0;m<12;m++){const k=p.a+(y*12+m-(p.sy*12+p.sm));if(k>=1&&k<=p.t)r.push({id:p.id,d:`${y}-${pd(m+1)}-${pd(p.dy||1)}`,n:p.n,v:p.v,c:p.c,p:p.p,par:`${k}/${p.t}`,k,t:p.t,f:0})}return r}
const GA=y=>[...Y(y).g,...S.cfg.parc.flatMap(p=>parcOf(p,y))],arr=(y,k)=>k=='g'?GA(y):Y(y)[k];
const tot=(y,k)=>MN.map((_,m)=>T(arr(y,k).filter(x=>mo(x)==m),x=>x.v));
const sum=(y,k)=>T(tot(y,k)),ys=()=>[...new Set([...S.cfg.years,CY,CY-1])].sort();
function toast(t){const d=document.createElement('div');d.id='ts';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
const pth=k=>`data/users/${uid}/${k}`;
async function ld(k){try{if(db&&uid){const s=await db.doc(pth(k)).get();if(s.exists)return s.data()}}catch(e){}
try{return JSON.parse(localStorage.getItem('fin_'+k))}catch(e){return null}}
async function sv(k,o){let ok=false;try{if(db&&uid){await db.doc(pth(k)).set(JSON.parse(JSON.stringify(o)));ok=true}}catch(e){}
try{localStorage.setItem('fin_'+k,JSON.stringify(o))}catch(e){}if(!ok)toast('Salvo só neste aparelho')}
const saveY=y=>sv('y'+y,Y(y)),saveC=()=>sv('cfg',S.cfg);
const PAL=['#c2578a','#7b6cc4','#2e9e6b','#e39b00','#3d8bd9','#d64550','#17a2b8','#8c6d46','#e0719f','#5c7a29','#9b59b6','#f08a4b'];
const col=n=>{const c=S.cfg;if(c.col[n])return c.col[n];if(n=='Sem meta')return '#9aa0a6';let i=c.cats.findIndex(x=>x.n==n);if(i<0)i=c.inv.indexOf(n);if(i<0){i=c.cards.findIndex(x=>x.n==n);if(i>=0)i+=5}if(i<0)i=[...String(n)].reduce((s,ch)=>s+ch.charCodeAt(0),0);return PAL[i%PAL.length]};
const grp=(a,f,d)=>{const m={};a.forEach(x=>{const k=x[f]||d||'(sem categoria)';m[k]=(m[k]||0)+x.v});return Object.entries(m).map(([n,v])=>({n,v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)};
function pie(a){const t=T(a,x=>x.v);if(!t)return '';let s='<svg viewBox="-1 -1 2 2" width="130" height="130" style="transform:rotate(-90deg)">',ac=0;
const at=(x,i)=>`data-a="sl" data-i="${i}" data-n="${esc(x.n)}" data-v="${x.v}" data-p="${(x.v/t*100).toFixed(1)}"`;
a.forEach((x,i)=>{const f=x.v/t;if(f>=.9999)s+=`<circle r="1" ${at(x,i)} fill="${col(x.n)}"/>`;else{const a1=ac*2*Math.PI,a2=(ac+f)*2*Math.PI;s+=`<path d="M0 0L${Math.cos(a1)} ${Math.sin(a1)}A1 1 0 ${f>.5?1:0} 1 ${Math.cos(a2)} ${Math.sin(a2)}Z" ${at(x,i)} fill="${col(x.n)}"/>`}ac+=f});
return `<div class="pie">${s}</svg><div style="flex:1 1 140px"><div class="inf">Toque numa fatia</div>${a.map((x,i)=>`<div class="lg2" ${at(x,i)}><i style="background:${col(x.n)}"></i>${esc(x.n)} <b>${(x.v/t*100).toFixed(0)}%</b></div>`).join('')}</div></div>`}
function line(ss){const all=ss.flatMap(s=>s.d),mx=Math.max(1,...all),mn=Math.min(0,...all),W=330,H=120,X=i=>8+i*(W-16)/11,Yy=v=>10+(H-10-(v-mn)/(mx-mn)*(H-10));
let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%"><line x1="${X(V.m)}" x2="${X(V.m)}" y1="4" y2="${H}" stroke="var(--ln)" stroke-width="12" opacity=".6"/><text x="2" y="8" font-size="8" fill="var(--mu)">${R(mx)}</text>`;
if(mn<0)s+=`<line x1="0" x2="${W}" y1="${Yy(0)}" y2="${Yy(0)}" stroke="var(--mu)" stroke-dasharray="3" opacity=".5"/>`;
ss.forEach(z=>{s+=`<polyline fill="none" stroke="${z.c}" stroke-width="2" points="${z.d.map((v,i)=>X(i)+','+Yy(v)).join(' ')}"/>`+z.d.map((v,i)=>`<circle cx="${X(i)}" cy="${Yy(v)}" r="2.5" fill="${z.c}"/>`).join('')});
MN.forEach((n,i)=>s+=`<text x="${X(i)}" y="${H+16}" font-size="8" text-anchor="middle" fill="var(--mu)">${n.slice(0,3)}</text>`);
return s+`</svg><div class="lg">${ss.map(z=>`<span><i style="background:${z.c}"></i>${z.n}</span>`).join('')}</div>`}
const MV=(y,m)=>{if(m<0){m+=12;y--}if(m>11){m-=12;y++}const f=k=>arr(y,k).filter(x=>mo(x)==m),g=T(f('g').filter(x=>!x.par),x=>x.v),p=T(f('g').filter(x=>x.par),x=>x.v),e=T(f('e'),x=>x.v),i=T(f('i'),x=>x.v);return{e,g,p,o:g+p,s:e-g-p,i}};
const tri=u=>`<svg width="11" height="11" viewBox="0 0 10 10" style="margin-right:5px"><path d="${u?'M5 1L9.5 9H.5Z':'M5 9L.5 1h9Z'}" fill="currentColor"/></svg>`;
const ind=(a,b,s)=>{const d=a-b;if(Math.abs(d)<.005)return{c:'var(--tx)',h:'<span style="margin-right:5px">—</span>'};const g=d*s>0;return{c:g?'var(--ok)':'var(--bad)',h:tri(g)}};
const kc=(l,v,c='',d,pv,sub)=>`<div class="cd k"><small>${l}</small><b class="${c}"${d?` style="color:${d.c}"`:''}>${d?d.h:''}${R(v)}</b>${d?`<small>mês anterior: ${R(pv)}</small>`:''}${sub?`<small>${sub}</small>`:''}</div>`;
const dlt=(a,b,s)=>{if(!b)return '—';const d=a/b-1;return `<span class="${d*s>0?'ok':d*s<0?'bad':''}">${d>0?'+':''}${(d*100).toFixed(0)}%</span>`};
const opts=(l,v)=>[...new Set([...l,...(v&&!l.includes(v)?[v]:[])])].map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const cn=l=>l.map(x=>x.n??x);
function li(k,x){const S1=x=>`${x.c||'-'} · ${x.p||'-'}${x.f?' · 📌 fixo':''}${x.par?' · parcela '+x.par+' · faltam '+R((x.t-x.k)*x.v):''}`;const sub={g:S1(x),c:S1(x),e:x.s||'-',i:(x.t||'-')+(x.m?' → 🎯 '+x.m:''),d:x.g||'-'}[k];
return `<div class="li" data-a="ed" data-k="${k}" data-id="${x.id}"><span>${esc(x.n||sub)}<small>${x.d.slice(8)}/${x.d.slice(5,7)} · ${esc(sub)}</small></span><b>${R(x.v)}</b></div>`}
function bars(a,b,c1='var(--ac)',c2='var(--a2)'){const mx=Math.max(1,...a,...b),H=120,g=28;let s=`<svg viewBox="0 0 336 ${H+16}" width="100%">`;
for(let i=0;i<12;i++){const h1=Math.max(0,a[i])/mx*H,h2=Math.max(0,b[i])/mx*H;
s+=`<rect x="${i*g+2}" y="${H-h1}" width="12" height="${h1}" rx="2" fill="${c1}"/><rect x="${i*g+14}" y="${H-h2}" width="12" height="${h2}" rx="2" fill="${c2}"/><text x="${i*g+14}" y="${H+12}" font-size="8" text-anchor="middle" fill="var(--mu)">${MN[i].slice(0,3)}</text>`}return s+'</svg>'}
function vMes(){const y=V.y,m=V.m,F=k=>arr(y,k).filter(x=>mo(x)==m),gs=F('g'),es=F('e'),is=F('i'),c=S.cfg,cu=MV(y,m),pv=MV(y,m-1),fx=gs.filter(x=>x.f),pc=gs.filter(x=>x.par),fT=T(fx,x=>x.v);
let h=`<div class="mn"><button data-a="py" data-d="-1">‹</button><b>${y}</b><button data-a="py" data-d="1">›</button></div><div class="mc">${MN.map((n,i)=>`<button class="${i==m?'on':''}" data-a="sm" data-m="${i}">${n.slice(0,3)}</button>`).join('')}</div><div class="cs">${kc('Entradas',cu.e,'ok')}${kc('Saída',cu.o,'bad')}${kc('Gastos',cu.g,'',ind(cu.g,pv.g,-1),pv.g,`fixos ${R(fT)} + mensais ${R(cu.g-fT)}`)}${kc('Parcelas',cu.p,'',ind(cu.p,pv.p,-1),pv.p)}${kc('Saldo',cu.s,'',ind(cu.s,pv.s,1),pv.s)}${kc('Investido',cu.i,'',ind(cu.i,pv.i,1),pv.i)}</div>`;
h+=`<h2>Panorama em ${y}</h2><div class="cd">${line([{n:'Entradas',c:'var(--ok)',d:tot(y,'e')},{n:'Saída',c:'var(--bad)',d:tot(y,'g')},{n:'Saldo',c:'var(--a2)',d:tot(y,'e').map((v,i)=>v-tot(y,'g')[i])},{n:'Investido',c:'#e39b00',d:tot(y,'i')}])}</div>`;
h+=`<h2>📌 Gastos fixos <small style="color:var(--mu)">${R(fT)} · mensais ${R(cu.g-fT)}</small></h2><div class="cd big">${fx.length?fx.map(x=>li('g',x)).join(''):'<small>Nenhum fixo. Marque “Gasto fixo” ao lançar um gasto.</small>'}${fx.length?`<div class="sep"><small>Por categoria</small>${pie(grp(fx,'c'))}</div>`:''}</div>`;
h+=`<h2>💳 Parcelados no cartão <small style="color:var(--mu)">${R(cu.p)} neste mês</small></h2><div class="cd big">${pc.length?pc.map(x=>li('c',x).replace(' data-a="ed"','')).join(''):'<small>Nenhum parcelado neste mês.</small>'}${pc.length?`<div class="sep"><small>Por categoria</small>${pie(grp(pc,'c'))}</div>`:''}</div>`;
h+=`<h2>Por cartão / forma de pagamento</h2><div class="cd">${pie(grp(gs,'p','Sem cartão'))}`;
[...new Set([...cn(c.cards),...gs.map(x=>x.p||'-')])].forEach(n=>{const s=T(gs.filter(x=>(x.p||'-')==n),x=>x.v);if(s)h+=`<div class="li"><span><i class="dt" style="background:${col(n)}"></i>${esc(n)}<small>${esc((c.cards.find(x=>x.n==n)||{}).t||'')}</small></span><b>${R(s)}</b></div>`});
h+=`</div>`;
const L=(t,k,a)=>`<h2>${t}</h2><div class="cd">${a.length?a.sort((x,z)=>z.d.localeCompare(x.d)).map(x=>li(x.par?'c':k,x)).join(''):'<small>Vazio</small>'}</div>`;
h+=L('Entradas','e',es)+L('Gastos do mês','g',gs.filter(x=>!x.f))+L('Investimentos do mês','i',is);
const pY=m?y:y-1,pM=m?m-1:11,pg=arr(pY,'g').filter(x=>mo(x)==pM),cl=x=>x.c||'(sem categoria)';
h+=`<h2>Gastos por categoria</h2><div class="cd">${pie(grp(gs,'c'))}`;let any=0;
[...new Set([...cn(c.cats),...gs.map(cl),...pg.map(cl)])].forEach(n=>{const b=(c.cats.find(x=>x.n==n)||{}).b||0,s=T(gs.filter(x=>cl(x)==n),x=>x.v),pr=T(pg.filter(x=>cl(x)==n),x=>x.v);if(!s&&!b&&!pr)return;any=1;const p=b?s/b:0,d=s-pr;let ih,cc,pt;
if(Math.abs(d)<.005){ih='<span style="margin-right:5px">—</span>';cc='var(--tx)';pt=s?'0%':''}else{const g=d<0;ih=tri(g);cc=g?'var(--ok)':'var(--bad)';pt=pr?`${d>0?'+':'−'}${Math.abs(d/pr*100).toFixed(0)}%`:'novo'}
h+=`<div class="rw"><div><span><i class="dt" style="background:${col(n)}"></i>${esc(n)}</span><span style="color:${cc};display:flex;align-items:center">${ih}${R(s)}<small style="margin-left:6px;color:${cc}">${pt}</small></span></div>${b?`<small style="color:var(--mu);display:block">orçamento ${R(b)}</small><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${p>1?'var(--bad)':col(n)}"></i></div>`:''}</div>`});
return h+(any?'':'<small>Nenhum gasto neste mês.</small>')+`<small style="color:var(--mu);display:block;margin-top:6px">▲ verde = gastou menos que no mês anterior · ▼ vermelho = gastou mais · % = variação sobre o mês anterior</small></div><button class="pr fab" data-a="add">+</button>`}
function vRes(){const y=V.ay,n=y==CY?NOW.getMonth()+1:12,E=tot(y,'e'),O=tot(y,'g'),P=MN.map((_,m)=>T(arr(y,'g').filter(x=>x.par&&mo(x)==m),x=>x.v)),I=tot(y,'i'),ga=arr(y,'g'),c=S.cfg;
const rows=[['Entradas',E,'ok'],['Saída',O,'bad'],['Gastos',O.map((v,i)=>v-P[i]),''],['Parcelas',P,''],['Saldo',E.map((v,i)=>v-O[i]),''],['Investido',I,'']];
let h=`<div class="mn"><button data-a="pa" data-d="-1">‹</button><b>Ano ${y}</b><button data-a="pa" data-d="1">›</button></div><div class="cd"><table><tr><th></th><th>Total no ano</th><th>Média por mês</th></tr>${rows.map(r=>{const t=T(r[1]);return `<tr class="${r[2]}"><td>${r[0]}</td><td>${R(t)}</td><td>${R(t/n)}</td></tr>`}).join('')}</table><small style="color:var(--mu)">Média = total ÷ ${n} ${n==1?'mês':'meses'}${y==CY?' (do início do ano até o mês atual)':''}. Saída = gastos + parcelas.</small></div>`;
const cn2=[...new Set([...cn(c.cards),...ga.map(x=>x.p||'Sem cartão')])].map(k=>({n:k,v:T(ga.filter(x=>(x.p||'Sem cartão')==k),x=>x.v)})),ct=T(cn2,x=>x.v);
h+=`<div class="cd" style="margin-top:10px"><table><tr><th>Cartão</th><th>Total no ano</th><th>Média por mês</th></tr>${cn2.map(x=>`<tr><td><i class="dt" style="background:${col(x.n)}"></i>${esc(x.n)}</td><td>${R(x.v)}</td><td>${R(x.v/n)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${R(ct)}</b></td><td><b>${R(ct/n)}</b></td></tr></table></div>`;
